[package]
name = "route7q9k"
version = "2.2.1"
edition = "2021"
description = "OpenAI-, Anthropic- and Ollama-compatible local API for the OpenCode Zen free models"
publish = false

[[bin]]
name = "7q9k-route"
path = "src/main.rs"

[lib]
name = "route7q9k"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std"] }
ctrlc = "3.4.5"
httparse = "1.9.4"
rand = "0.8.5"
regex = "1.10.6"
serde_json = { version = "1.0.128", features = ["preserve_order"] }
socket2 = "0.5.7"
ureq = { version = "2.10.1", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52.0"
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
] }


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
