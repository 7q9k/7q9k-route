<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oc-free-api</title>
<style>
  :root{ color-scheme: light; --line:#e4e4e0; --mut:#8a8a86; --accent:#0a7c4f; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#fcfcfa; color:#1c1d1f; font:15px/1.55 "Segoe UI",system-ui,sans-serif; }
  main{ max-width:640px; margin:0 auto; padding:48px 24px 64px; }
  h1{ font-size:16px; font-weight:600; margin:0; display:flex; align-items:center; gap:9px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); }
  .dot.down{ background:#c0392b; }
  small{ color:var(--mut); font-weight:400; }
  section{ margin-top:34px; padding-top:22px; border-top:1px solid var(--line); }
  h2{ margin:0 0 12px; font-size:11px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--mut); }
  .row{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:5px 0; }
  .row .label{ color:var(--mut); font-size:13px; flex:0 0 auto; }
  .row code{ font:13px "Cascadia Code",ui-monospace,Consolas,monospace; overflow-wrap:anywhere; }
  button{ font:inherit; font-size:12px; background:#fff; border:1px solid var(--line); border-radius:6px; padding:3px 10px; cursor:pointer; color:#1c1d1f; }
  button:hover{ border-color:#b9b9b4; }
  button.accent{ color:var(--accent); border-color:var(--accent); }
  button.danger{ color:#c0392b; border-color:#e3b2ae; }
  button:disabled{ opacity:.4; cursor:wait; }
  .test{ min-width:56px; }
  .res{ color:var(--mut); font-size:12px; text-align:right; overflow-wrap:anywhere; }
  .res.ok{ color:var(--accent); } .res.err{ color:#c0392b; }
  #log{ font:12px/1.7 "Cascadia Code",ui-monospace,Consolas,monospace; color:#5d5d58; max-height:220px; overflow:auto; white-space:pre-wrap; }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; }
  details summary{ cursor:pointer; color:var(--mut); font-size:12px; margin-top:10px; outline:none; }
  pre{ margin:10px 0 0; background:#f4f4f1; border:1px solid var(--line); border-radius:8px; padding:12px; font:12px/1.6 ui-monospace,Consolas,monospace; overflow-x:auto; }
  footer{ margin-top:40px; color:var(--mut); font-size:12px; }
  #toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1c1d1f; color:#fff; border-radius:6px; padding:7px 14px; font-size:12px; opacity:0; transition:opacity .25s; pointer-events:none; }
</style>
</head>
<body>
<main>
  <h1><span id="dot" class="dot"></span> oc-free-api <small>· OpenCode free models</small></h1>

  <section>
    <h2>Zugang</h2>
    <div class="row"><span class="label">Dashboard (diese Seite)</span><code id="urlDash"></code></div>
    <div class="row"><span class="label">OpenAI-Base-URL</span><code id="urlOpenai"></code><button data-copy="urlOpenai">Kopieren</button></div>
    <div class="row" id="rowLan" hidden><span class="label">Netzwerk</span><code id="urlLan"></code></div>
    <div class="row"><span class="label">API-Key</span><code id="apiKey"></code><button data-copy="apiKey">Kopieren</button></div>
  </section>

  <section>
    <h2>Modelle — Test-Button sendet eine echte Anfrage</h2>
    <table style="width:100%; border-collapse:collapse" id="tbl"></table>
  </section>

  <section>
    <h2>Live-Log</h2>
    <div id="log">–</div>
  </section>

  <section>
    <div class="actions">
      <button class="accent" id="btnRefresh">Modelle aktualisieren</button>
      <button id="btnKey">Key neu generieren</button>
      <button class="danger" id="btnStop">Server stoppen</button>
    </div>
    <details>
      <summary>Client-Snippet (Python, OpenAI-kompatibel)</summary>
      <pre id="snip"></pre>
    </details>
  </section>

  <footer>Persönliche Nutzung · <code id="status" class="res"></code></footer>
</main>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const toast=m=>{const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,1500)};
document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText($(b.dataset.copy).textContent.trim());toast('kopiert')});

async function api(p,body){
  const r=await fetch(p,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});
  const j=await r.json();
  if(!r.ok||j.ok===false) throw new Error((j.error&&j.error.message)||j.message||('HTTP '+r.status));
  return j;
}

function render(d){
  $('dot').classList.remove('down');
  $('urlDash').textContent=location.origin;
  $('urlOpenai').textContent=location.origin+'/v1';
  if(d.lan_ip){ $('rowLan').hidden=false; $('urlLan').textContent='http://'+d.lan_ip+':'+location.port+'/'; }
  $('apiKey').textContent=d.api_key;
  $('snip').textContent=`from openai import OpenAI\nclient=OpenAI(\n    base_url="${location.origin}/v1",\n    api_key="${d.api_key}",\n)\nr=client.chat.completions.create(model="big-pickle",\n    messages=[{"role":"user","content":"hi"}])`;
  const tb=$('tbl'); tb.innerHTML='';
  (d.models||[]).forEach(m=>{
    const tr=document.createElement('tr'); tr.style.borderBottom='1px solid var(--line)';
    tr.innerHTML=`<td style="padding:6px 0; font:13px ui-monospace,monospace">${m}</td>`+
      `<td style="width:120px; text-align:right"><button class="test" data-m="${m}">Test</button></td>`+
      `<td style="width:52%"><span class="res" id="res"></span></td>`;
    tb.appendChild(tr);
    tr.querySelector('button').onclick=e=>testModel(m,tr.querySelector('.res'),e.target);
  });
  $('log').textContent=(d.log||[]).slice(-60).map(e=>e.t+'  '+e.msg).join('\n')||'–';
  $('log').scrollTop=1e9;
}
async function load(){ try{ render(await api('/api/dashboard')) }catch(e){ $('dot').classList.add('down') } }
async function testModel(m,span,btn){
  span.className='res'; span.textContent='…'; btn.disabled=true;
  try{ const r=await api('/api/dashboard/test',{model:m});
    span.classList.add('ok'); span.textContent=`${(r.latency_ms/1000).toFixed(1)}s · ${r.tokens} tok`;
  }catch(e){ span.classList.add('err'); span.textContent=e.message.slice(0,90); }
  btn.disabled=false; setTimeout(load,400);
}
$('btnRefresh').onclick=async e=>{e.target.disabled=true;try{await api('/api/dashboard/refresh',{});toast('aktualisiert');load()}catch(err){toast(err.message)}finally{e.target.disabled=false}};
$('btnKey').onclick=async e=>{e.target.disabled=true;try{await api('/api/dashboard/key',{});toast('neuer Key aktiv');load()}catch(err){toast(err.message)}finally{e.target.disabled=false}};
$('btnStop').onclick=async()=>{if(confirm('wirklich stoppen?')){try{await api('/api/dashboard/stop',{});toast('stoppt …')}catch(e){}}};
setInterval(async()=>{try{const r=await api('/api/dashboard/log');const l=$('log');l.textContent=(r.log||[]).slice(-60).map(e=>e.t+'  '+e.msg).join('\n');l.scrollTop=1e9}catch(e){}},1500);
load();
</script>
</body>
</html>
